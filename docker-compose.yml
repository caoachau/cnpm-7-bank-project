version: "3"
services:
  app:
    build: ./api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  frontend:
    build: ./solution
    ports:
      - "3000:80"
    container_name: frontend
    restart: unless-stopped
volumes:
  mongo-data: